services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-arcates}
      POSTGRES_USER: ${POSTGRES_USER:-arcates}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - arcates_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arcates} -d ${POSTGRES_DB:-arcates}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - arcates_internal

  migrate:
    build:
      context: .
      target: migrate
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-arcates}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-arcates}?schema=public
    depends_on:
      db:
        condition: service_healthy
    networks:
      - arcates_internal

  web:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        APP_VERSION: ${ARCATES_RELEASE_TAG:-development}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-arcates}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-arcates}?schema=public
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      APP_VERSION: ${ARCATES_RELEASE_TAG:-development}
      RATE_LIMIT_SECRET: ${RATE_LIMIT_SECRET}
      METRICS_TOKEN: ${METRICS_TOKEN}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      WHATSAPP_GRAPH_API_VERSION: ${WHATSAPP_GRAPH_API_VERSION:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
    ports:
      - "127.0.0.1:${ARCATES_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 8s
      retries: 6
      start_period: 30s
    networks:
      - arcates_internal
      - arcates_proxy

volumes:
  arcates_postgres_data:

networks:
  arcates_internal:
    internal: true
  arcates_proxy:
