name: Release Images

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

env:
  REGISTRY: ghcr.io
  WEB_IMAGE: ghcr.io/${{ github.repository }}
  MIGRATE_IMAGE: ghcr.io/${{ github.repository }}-migrate
  RELEASE_SITE_URL: ${{ vars.ARCATES_SITE_URL || 'https://arcates.com' }}

jobs:
  publish:
    name: Build and publish release images
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify tagged release source and version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release tags must point to a commit contained in main." >&2
            exit 1
          }
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$package_version" != "$tag_version" ]]; then
            echo "Tag version ${tag_version} does not match package.json version ${package_version}." >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate web image metadata
        id: web_meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.WEB_IMAGE }}
          tags: |
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}

      - name: Generate migration image metadata
        id: migrate_meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.MIGRATE_IMAGE }}
          tags: |
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}

      - name: Build and push web image
        id: web_push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: ${{ steps.web_meta.outputs.tags }}
          labels: ${{ steps.web_meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ env.RELEASE_SITE_URL }}
            APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=release-web
          cache-to: type=gha,mode=max,scope=release-web
          provenance: false
          sbom: true

      - name: Build and push migration image
        id: migrate_push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          push: true
          tags: ${{ steps.migrate_meta.outputs.tags }}
          labels: ${{ steps.migrate_meta.outputs.labels }}
          cache-from: type=gha,scope=release-migrate
          cache-to: type=gha,mode=max,scope=release-migrate
          provenance: false
          sbom: true

      - name: Attest web image provenance
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.WEB_IMAGE }}
          subject-digest: ${{ steps.web_push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest migration image provenance
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.MIGRATE_IMAGE }}
          subject-digest: ${{ steps.migrate_push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Create release digest manifest
        shell: bash
        run: |
          cat > arcates-release-manifest.txt <<EOF
          release=${{ github.ref_name }}
          commit=${GITHUB_SHA}
          site_url=${RELEASE_SITE_URL}
          web_image=${WEB_IMAGE}@${{ steps.web_push.outputs.digest }}
          migration_image=${MIGRATE_IMAGE}@${{ steps.migrate_push.outputs.digest }}
          EOF
          sha256sum arcates-release-manifest.txt > arcates-release-manifest.txt.sha256

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            --title "Arcates ${GITHUB_REF_NAME}" \
            "${prerelease[@]}" \
            arcates-release-manifest.txt \
            arcates-release-manifest.txt.sha256

      - name: Publish release summary
        shell: bash
        run: |
          {
            echo "## Arcates container release"
            echo
            echo "Site URL: ${RELEASE_SITE_URL}"
            echo "Version: ${{ github.ref_name }}"
            echo
            echo "### Web image"
            echo '```text'
            echo "${WEB_IMAGE}@${{ steps.web_push.outputs.digest }}"
            echo '```'
            echo
            echo "### Migration image"
            echo '```text'
            echo "${MIGRATE_IMAGE}@${{ steps.migrate_push.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
