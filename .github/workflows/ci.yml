name: Quality

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate database schema
        env:
          DATABASE_URL: postgresql://arcates:arcates@localhost:5432/arcates
        run: npm run db:validate
      - name: Type check
        run: npm run typecheck
      - name: Production build
        shell: bash
        run: |
          set +e
          npm run build > build.log 2>&1
          status=$?
          tail -n 60 build.log
          exit $status
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 3
